name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: go run ./scripts/check-format.go
      - run: go test ./...
      - run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Fuzz seed parsing
        if: runner.os == 'Linux'
        run: go test ./internal/random -run '^$' -fuzz FuzzParseSeed -fuzztime 5s
      - name: Fuzz puzzle resolution
        if: runner.os == 'Linux'
        run: go test ./internal/puzzle -run '^$' -fuzz FuzzResolution -fuzztime 5s
      - name: Fuzz move validation
        if: runner.os == 'Linux'
        run: go test ./internal/cube -run '^$' -fuzz FuzzMoveValidation -fuzztime 5s
