name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Verify dependency checksums
        run: go mod verify
      - name: Install pinned analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Staticcheck
        run: staticcheck ./...
      - name: Scan all required modules
        run: govulncheck -C cmd/turnsmith -scan module
      - name: Scan reachable code including tests
        run: govulncheck -test ./...
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: go run ./scripts/check-format.go
      - run: go test ./...
      - run: go vet ./...
      - name: Race detector
        if: runner.os == 'Linux'
        # Full sampler sweeps already ran in the native test step. The short
        # race suite retains table, concurrent-generation and storage checks.
        run: go test -race -short ./...
      - name: Fuzz seed parsing
        if: runner.os == 'Linux'
        run: go test ./internal/random -run '^$' -fuzz FuzzParseSeed -fuzztime 5s
      - name: Fuzz puzzle resolution
        if: runner.os == 'Linux'
        run: go test ./internal/puzzle -run '^$' -fuzz FuzzResolution -fuzztime 5s
      - name: Fuzz move validation
        if: runner.os == 'Linux'
        run: go test ./internal/cube -run '^$' -fuzz FuzzMoveValidation -fuzztime 5s
